name: Verificações do site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar páginas e SEO
        run: node scripts/smoke-test.cjs
      - name: Verificar ambiente de produção
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/production-check.cjs
