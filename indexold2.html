<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Temporariamente Fora do Ar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f3f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .loader {
            border: 6px solid #ccc;
            border-top: 6px solid #3c8dbc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Estamos fora do ar.</h1>
        <!-- <p>Estamos realizando manutenção para melhorar sua experiência.<br>
        Por favor, volte em alguns instantes.</p> -->

        <footer>© 2025 — Todos os direitos reservados.</footer>
    </div>
</body>
</html>
