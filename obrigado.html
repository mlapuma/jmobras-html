<!doctype html>
<html lang="pt-br">

    body{font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:48px auto;padding:0 16px;line-height:1.6}

  <div class="card">
    <h1>Obrigado!</h1>

</html>
